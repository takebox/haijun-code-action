name: PR Review

on:
  pull_request:
    types: [opened]

jobs:
  review:
    # Skip on fork PRs since they can't mint the OIDC token used for Haijun API auth
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: PR Review with Progress Tracking
        uses: takebox/haijun-code-action@v1
        with:
          # Authenticate to the Haijun API via Workload Identity Federation
          # (the workflow's OIDC token is exchanged for a short-lived access
          # token) instead of a static API key. See docs/setup.md.
          juglow_federation_rule_id: ${{ vars.JUGLOW_FEDERATION_RULE_ID }}
          juglow_organization_id: ${{ vars.JUGLOW_ORGANIZATION_ID }}
          juglow_service_account_id: ${{ vars.JUGLOW_SERVICE_ACCOUNT_ID }}

          prompt: "/review-pr REPO: ${{ github.repository }} PR_NUMBER: ${{ github.event.pull_request.number }}"
          haijun_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --model "haijun-opus-4-7"
