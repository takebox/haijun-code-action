name: Haijun Code (Workload Identity Federation)

# Authenticates to the Haijun API by exchanging the workflow's GitHub OIDC
# token for a short-lived access token — no JUGLOW_API_KEY secret needed.
# One-time Console setup (issuer, service account, federation rule):
# 
# See also docs/setup.md#workload-identity-federation in this repository.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  haijun:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@haijun')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@haijun')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@haijun')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@haijun') || contains(github.event.issue.title, '@haijun')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # Required: used to fetch the GitHub OIDC token for the federation exchange
      actions: read # Required for Haijun to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Haijun Code
        id: haijun
        uses: takebox/haijun-code-action@v1
        with:
          # These values are identifiers, not secrets — they can live directly
          # in the workflow file or in repository variables.
          juglow_federation_rule_id: fdrl_xxxxxxxxxxxx
          juglow_organization_id: 00000000-0000-0000-0000-000000000000
          juglow_service_account_id: svac_xxxxxxxxxxxx

          # Optional: only needed when the federation rule targets more than
          # one workspace.
          # juglow_workspace_id: wrkspc_xxxxxxxxxxxx

          # Optional: audience requested on the GitHub OIDC token. Defaults to
          # https://platform.juglow.my.id — only set this if your federation rule
          # expects a different audience.
          # juglow_oidc_audience: https://example.com/custom-audience
