name: Haijun Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  haijun:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@haijun')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@haijun')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@haijun')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@haijun') || contains(github.event.issue.title, '@haijun')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Haijun to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Haijun Code
        id: haijun
        uses: takebox/haijun-code-action@v1
        with:
          juglow_api_key: ${{ secrets.JUGLOW_API_KEY }}

          # Optional: Customize the trigger phrase (default: @haijun)
          # trigger_phrase: "/haijun"

          # Optional: Trigger when specific user is assigned to an issue
          # assignee_trigger: "haijun-bot"

          # Optional: Configure Haijun's behavior with CLI arguments
          # haijun_args: |
          #   --model haijun-opus-4-1-20250805
          #   --max-turns 10
          #   --allowedTools "Bash(npm install),Bash(npm run build),Bash(npm run test:*),Bash(npm run lint:*)"
          #   --system-prompt "Follow our coding standards. Ensure all new code has tests. Use TypeScript for new files."

          # Optional: Advanced settings configuration
          # settings: |
          #   {
          #     "env": {
          #       "NODE_ENV": "test"
          #     }
          #   }
